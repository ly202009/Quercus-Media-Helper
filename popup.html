<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quercus Media Settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Quercus Media Gallery Pro</h1>
      <p>Click any keybind button and press your desired key combination.</p>
    </header>

    <section class="card">
      <h2>Playback &amp; Skip Settings</h2>

      <div class="field-row">
        <label for="skipSeconds">Arrow Key Skip (seconds)</label>
        <input type="number" id="skipSeconds" min="1" max="120" step="1" />
      </div>

      <div class="field-row">
        <label for="holdSpaceSpeed">Hold Space Speed (x)</label>
        <input type="number" id="holdSpaceSpeed" min="0.5" max="5" step="0.25" />
      </div>

      <div class="field-col">
        <label for="speedSteps">Speed Notches (comma-separated)</label>
        <input type="text" id="speedSteps" placeholder="0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2" />
        <small>Used when stepping up/down with speed keybinds.</small>
      </div>
    </section>

    <section class="card">
      <h2>Keybinds</h2>
      <div id="keybindsList" class="keybinds-list"></div>
    </section>

    <footer>
      <button id="resetBtn" class="btn-secondary">Reset Defaults</button>
      <span id="statusMsg" class="status-msg">Saved!</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
